[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# Endpoints come from .env (see .env.example).
[rpc_endpoints]
deploy = "${RPC_URL}"

# CI: same settings, more fuzz runs.
[profile.ci]
fuzz = { runs = 4096 }
